name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # This step used to read:
      #     python -m py_compile python-shiny/*/app.py 2>/dev/null || echo "Syntax check complete"
      # The `|| echo` meant the job could not fail. A syntax error printed
      # "Syntax check complete" and exited 0. No pipefail, no fallback.
      - name: Compile every app
        run: |
          set -euo pipefail
          for f in python-shiny/*/app.py; do
            echo "compiling $f"
            python -m py_compile "$f"
          done

      # A file can compile and still fail on import: a bad default argument, a
      # missing module, a name error at module scope. Importing is the cheapest
      # check that the app would actually start.
      - name: Import every app
        run: |
          set -euo pipefail
          for d in python-shiny/*/; do
            echo "importing ${d}app.py"
            (cd "$d" && python -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('app', 'app.py')
          m = importlib.util.module_from_spec(spec)
          sys.modules['app'] = m
          spec.loader.exec_module(m)
          assert hasattr(m, 'app'), 'no Shiny App object defined'
          print('  ok')
          ")
          done

      - name: Test suite
        run: python -m pytest tests/ -q

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      # The five R apps are 5,113 lines and were checked by nothing at all.
      # `parse()` will not catch a logic error, but it does catch the class of
      # mistake that makes an app fail to start, which is what shipped unnoticed.
      - name: Parse every R app
        run: |
          Rscript -e '
            files <- Sys.glob("r-shiny/*/app.R")
            stopifnot(length(files) > 0)
            bad <- character(0)
            for (f in files) {
              res <- tryCatch({ parse(f); NULL }, error = function(e) conditionMessage(e))
              if (is.null(res)) cat("ok    ", f, "\n")
              else { cat("FAIL  ", f, "\n      ", res, "\n"); bad <- c(bad, f) }
            }
            if (length(bad)) quit(status = 1)
            cat(sprintf("PASS - %d R apps parse\n", length(files)))
          '
